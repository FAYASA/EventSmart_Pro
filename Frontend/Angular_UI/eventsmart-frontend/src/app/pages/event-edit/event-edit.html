<div class="container my-4" style="max-width: 600px;">
  <h2 class="mb-4">Edit Event</h2>

  <form (ngSubmit)="save()" *ngIf="!loading; else loadingTpl" #form="ngForm">
    <!-- Title -->
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input id="title" name="title" type="text" class="form-control" [(ngModel)]="event.title" required #title="ngModel" />
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" name="description" rows="4" class="form-control" [(ngModel)]="event.description" required #description="ngModel"></textarea>
    </div>

    <!-- Dates -->
    <div class="mb-3 row">
      <div class="col">
        <label for="startDate" class="form-label">Start Date</label>
        <input id="startDate" name="startDate" type="date" class="form-control" [(ngModel)]="event.startDate" required #startDate="ngModel" />
      </div>

      <div class="col">
        <label for="endDate" class="form-label">End Date</label>
        <input id="endDate" name="endDate" type="date" class="form-control" [(ngModel)]="event.endDate" required #endDate="ngModel" />
      </div>
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <select id="category" name="categoryId" class="form-select" [(ngModel)]="event.categoryId" required #categoryId="ngModel">
        <option [value]= "event.title" disabled>Select category</option>
        <option *ngIf="categories.length === 0" disabled>No categories available</option>
        <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
      </select>
    </div>

    <!-- Venue -->
    <div class="mb-3">
      <label for="venue" class="form-label">Venue</label>
      <select id="venue" name="venueId" class="form-select" [(ngModel)]="event.venueId" required #venueId="ngModel">
        <option [value]="null" disabled>Select venue</option>
        <option *ngIf="venues.length === 0" disabled>No venues available</option>
        <option *ngFor="let v of venues" [value]="v.id">{{ v.name }}</option>
      </select>
    </div>

    <!-- Image URL -->
    <div class="mb-3">
      <label for="imageUrl" class="form-label">Image URL</label>
      <input id="imageUrl" name="imageUrl" type="url" class="form-control" [(ngModel)]="event.imageUrl" />
    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    </div>

    <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
  </form>

  <ng-template #loadingTpl>
    <div class="d-flex justify-content-center align-items-center" style="height: 150px;">
      <div class="spinner-border text-primary" role="status"></div>
      <span class="ms-3">Loading event data...</span>
    </div>
  </ng-template>
</div>
