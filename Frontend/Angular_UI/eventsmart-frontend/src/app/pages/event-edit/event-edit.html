<div class="container my-4" style="max-width: 600px;">
  <h2 class="mb-4">Edit Event</h2>

  <form (ngSubmit)="save()" *ngIf="!loading; else loadingTpl" #form="ngForm">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input
        id="title"
        name="title"
        type="text"
        class="form-control"
        [(ngModel)]="event.title"
        required
        #title="ngModel"
      />
      <div *ngIf="title.invalid && title.touched" class="text-danger small">
        Title is required
      </div>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea
        id="description"
        name="description"
        rows="4"
        class="form-control"
        [(ngModel)]="event.description"
        required
        #description="ngModel"
      ></textarea>
      <div *ngIf="description.invalid && description.touched" class="text-danger small">
        Description is required
      </div>
    </div>

    <div class="mb-3 row">
      <div class="col">
        <label for="startDate" class="form-label">Start Date</label>
        <input
          id="startDate"
          name="startDate"
          type="date"
          class="form-control"
          [(ngModel)]="event.startDate"
          required
          #startDate="ngModel"
        />
        <div *ngIf="startDate.invalid && startDate.touched" class="text-danger small">
          Start date is required
        </div>
      </div>

      <div class="col">
        <label for="endDate" class="form-label">End Date</label>
        <input
          id="endDate"
          name="endDate"
          type="date"
          class="form-control"
          [(ngModel)]="event.endDate"
          required
          #endDate="ngModel"
        />
        <div *ngIf="endDate.invalid && endDate.touched" class="text-danger small">
          End date is required
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <select
        id="category"
        name="categoryId"
        class="form-select"
        [(ngModel)]="event.categoryId"
        required
        #categoryId="ngModel"
      >
        <option [value]="null" disabled>Select category</option>
        <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
      </select>
      <div *ngIf="categoryId.invalid && categoryId.touched" class="text-danger small">
        Category is required
      </div>
    </div>

    <div class="mb-3">
      <label for="venue" class="form-label">Venue</label>
      <select
        id="venue"
        name="venueId"
        class="form-select"
        [(ngModel)]="event.venueId"
        required
        #venueId="ngModel"
      >
        <option [value]="null" disabled>Select venue</option>
        <option *ngFor="let v of venues" [value]="v.id">{{ v.name }}</option>
      </select>
      <div *ngIf="venueId.invalid && venueId.touched" class="text-danger small">
        Venue is required
      </div>
    </div>

    <div class="mb-3">
      <label for="imageUrl" class="form-label">Image URL</label>
      <input
        id="imageUrl"
        name="imageUrl"
        type="url"
        class="form-control"
        [(ngModel)]="event.imageUrl"
        placeholder="https://example.com/image.jpg"
      />
    </div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    </div>

    <div *ngIf="error" class="mt-3 alert alert-danger">
      {{ error }}
    </div>
  </form>

  <ng-template #loadingTpl>
    <div class="d-flex justify-content-center align-items-center" style="height: 150px;">
      <div class="spinner-border text-primary" role="status"></div>
      <span class="ms-3">Loading event data...</span>
    </div>
  </ng-template>
</div>
