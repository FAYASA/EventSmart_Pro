<div class="container mt-4">
  <h2>Upcoming Events</h2>
  <div *ngIf="events.length === 0">No events available.</div>
  <div class="row row-cols-1 row-cols-md-2 g-4 mt-2">
    <div class="col" *ngFor="let event of events">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ event.title }}</h5>
          <p class="card-text">{{ event.description }}</p>
          <p><strong>Venue:</strong> {{ event.venue.name || 'Not specified' }}</p>
          <p><strong>Category:</strong> {{ event.category.name || 'Not specified' }}</p>
          <p>
            <strong>Dates:</strong>
            {{ event.startDate | date:'mediumDate' }} - {{ event.endDate | date:'mediumDate' }}
          </p>
          <a [routerLink]="['/events', event.id]" class="btn btn-outline-primary">Details</a>
        </div>
      </div>
    </div>
  </div>
</div>
