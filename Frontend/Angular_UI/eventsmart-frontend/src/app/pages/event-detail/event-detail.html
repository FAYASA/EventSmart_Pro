<div *ngIf="event" class="container my-4" style="max-width: 600px;">
  <div class="card shadow-sm">
    <!-- Event Image -->
    <img *ngIf="event.imageUrl"
         [src]="event.imageUrl"
         alt="{{ event.title }}"
         class="card-img-top"
         style="max-height: 220px; object-fit: cover;">

    <div class="card-body p-3">
      <!-- Title -->
      <h3 class="card-title fw-semibold mb-2">{{ event.title }}</h3>

      <!-- Description -->
      <p class="card-text text-secondary mb-3" style="font-size: 0.95rem;">{{ event.description }}</p>

      <!-- Event Details Grid -->
      <div class="row mb-3" style="font-size: 0.9rem;">
        <div class="col-6 mb-2">
          <h6 class="text-muted mb-1">Start Date</h6>
          <p class="mb-0">{{ event.startDate | date: 'mediumDate' }}</p>
        </div>
        <div class="col-6 mb-2">
          <h6 class="text-muted mb-1">End Date</h6>
          <p class="mb-0">{{ event.endDate | date: 'mediumDate' }}</p>
        </div>
        <div class="col-6 mb-2">
          <h6 class="text-muted mb-1">Category</h6>
          <p class="mb-0">{{ event.category?.name || 'N/A' }}</p>
        </div>
        <div class="col-6 mb-2">
          <h6 class="text-muted mb-1">Venue</h6>
          <p class="mb-0">{{ event.venue?.name || 'N/A' }}</p>
        </div>
      </div>

      <!-- Buttons -->
      <div>
        <button class="btn btn-warning btn-sm me-2" (click)="editEvent()">
          <i class="bi bi-pencil-square"></i> Edit
        </button>
        <button class="btn btn-danger btn-sm" (click)="deleteEvent()">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="!event" class="d-flex justify-content-center align-items-center my-4" style="min-height: 150px;">
  <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
  <span class="ms-3 fs-6">Loading event details...</span>
</div>
