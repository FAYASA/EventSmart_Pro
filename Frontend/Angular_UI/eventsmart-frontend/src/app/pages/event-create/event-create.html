<form [formGroup]="eventForm" (ngSubmit)="onSubmit()" novalidate class="container mt-4" style="max-width: 600px;">
  <h3 class="mb-4">Create New Event</h3>

  <div class="mb-3">
    <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
    <input id="title" type="text" class="form-control" formControlName="title" />
    <div *ngIf="eventForm.get('title')?.invalid && eventForm.get('title')?.touched" class="text-danger small">
      Title is required.
    </div>
  </div>

  <div class="mb-3">
    <label for="description" class="form-label">Description</label>
    <textarea id="description" rows="3" class="form-control" formControlName="description"></textarea>
  </div>

  <div class="mb-3">
    <label for="startDate" class="form-label">Start Date <span class="text-danger">*</span></label>
    <input id="startDate" type="datetime-local" class="form-control" formControlName="startDate" />
    <div *ngIf="eventForm.get('startDate')?.invalid && eventForm.get('startDate')?.touched" class="text-danger small">
      Start date is required.
    </div>
  </div>

  <div class="mb-3">
    <label for="endDate" class="form-label">End Date <span class="text-danger">*</span></label>
    <input id="endDate" type="datetime-local" class="form-control" formControlName="endDate" />
    <div *ngIf="eventForm.get('endDate')?.invalid && eventForm.get('endDate')?.touched" class="text-danger small">
      End date is required.
    </div>
  </div>

  <div class="mb-3">
    <label for="imageUrl" class="form-label">Image URL</label>
    <input id="imageUrl" type="url" class="form-control" formControlName="imageUrl" />
  </div>

  <div class="mb-3">
    <label for="venueId" class="form-label">Venue <span class="text-danger">*</span></label>
    <select id="venueId" class="form-select" formControlName="venueId">
      <option value="" disabled>Select a venue</option>
      <option *ngFor="let v of venues" [value]="v.id">{{ v.name }}</option>
    </select>
    <div *ngIf="eventForm.get('venueId')?.invalid && eventForm.get('venueId')?.touched" class="text-danger small">
      Venue is required.
    </div>
  </div>

  <div class="mb-3">
    <label for="categoryId" class="form-label">Category <span class="text-danger">*</span></label>
    <select id="categoryId" class="form-select" formControlName="categoryId">
      <option value="" disabled>Select a category</option>
      <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
    </select>
    <div *ngIf="eventForm.get('categoryId')?.invalid && eventForm.get('categoryId')?.touched" class="text-danger small">
      Category is required.
    </div>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="submitting">Create Event</button>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
</form>
